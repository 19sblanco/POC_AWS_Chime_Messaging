<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chime Messaging POC</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      height: 100vh;
    }

    /* ---- Login screen ---- */
    #login-screen {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    #login-screen h1 { margin-bottom: 8px; font-size: 22px; }
    #login-screen p { color: #666; margin-bottom: 16px; }
    .user-btn {
      width: 220px;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
    }
    .user-btn:hover { background: #e8f0fe; }

    /* ---- Chat screen ---- */
    #chat-screen { display: none; height: 100%; }
    #chat-screen.active { display: flex; }

    #sidebar {
      width: 220px;
      background: #1f2937;
      color: #fff;
      display: flex;
      flex-direction: column;
    }
    #sidebar .me {
      padding: 16px;
      font-weight: bold;
      border-bottom: 1px solid #374151;
    }
    #sidebar .me small { display: block; font-weight: normal; color: #9ca3af; }
    #channel-list { flex: 1; overflow-y: auto; }
    .channel-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 16px;
      background: none;
      border: none;
      color: #d1d5db;
      font-size: 15px;
      cursor: pointer;
    }
    .channel-btn:hover { background: #374151; }
    .channel-btn.active { background: #2563eb; color: #fff; }

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    #channel-header {
      padding: 14px 20px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      font-weight: bold;
    }
    #status { font-weight: normal; font-size: 12px; color: #888; margin-left: 8px; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg { max-width: 65%; }
    .msg .bubble {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid #e5e7eb;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.mine { align-self: flex-end; text-align: right; }
    .msg.mine .bubble { background: #2563eb; color: #fff; border: none; }
    .msg .meta { font-size: 11px; color: #888; margin-bottom: 2px; }

    #composer {
      display: flex;
      gap: 8px;
      padding: 12px 20px;
      background: #fff;
      border-top: 1px solid #e5e7eb;
    }
    #message-input {
      flex: 1;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    #send-btn {
      padding: 10px 20px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }
    #send-btn:disabled { background: #9ca3af; cursor: default; }
  </style>
</head>
<body>
  <div id="login-screen">
    <h1>Chime Messaging POC</h1>
    <p>Pick a user (open more tabs to chat as other users)</p>
    <div id="user-list"></div>
  </div>

  <div id="chat-screen">
    <div id="sidebar">
      <div class="me">
        <span id="me-name"></span>
        <small>Channels</small>
      </div>
      <div id="channel-list"></div>
    </div>
    <div id="main">
      <div id="channel-header">
        <span id="channel-name"></span>
        <span id="status"></span>
      </div>
      <div id="messages"></div>
      <form id="composer">
        <input id="message-input" type="text" placeholder="Type a message..." autocomplete="off" />
        <button id="send-btn" type="submit">Send</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
