<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chime Messaging POC</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      height: 100vh;
    }

    /* ---- Login screen ---- */
    #login-screen {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    #login-screen h1 { margin-bottom: 8px; font-size: 22px; }
    #login-screen p { color: #666; margin-bottom: 16px; }
    .user-btn {
      width: 220px;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
    }
    .user-btn:hover { background: #e8f0fe; }

    /* ---- Chat screen ---- */
    #chat-screen { display: none; height: 100%; }
    #chat-screen.active { display: flex; }

    #sidebar {
      width: 220px;
      background: #1f2937;
      color: #fff;
      display: flex;
      flex-direction: column;
    }
    #sidebar .me {
      padding: 16px;
      font-weight: bold;
      border-bottom: 1px solid #374151;
    }
    #sidebar .me small { display: block; font-weight: normal; color: #9ca3af; }
    #channel-list { flex: 1; overflow-y: auto; }
    .channel-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 16px;
      background: none;
      border: none;
      color: #d1d5db;
      font-size: 15px;
      cursor: pointer;
    }
    .channel-btn:hover { background: #374151; }
    .channel-btn.active { background: #2563eb; color: #fff; }

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    #channel-header {
      padding: 14px 20px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      font-weight: bold;
    }
    #status { font-weight: normal; font-size: 12px; color: #888; margin-left: 8px; }

    /* Channel timeline on the left, thread panel on the right. */
    #workspace { flex: 1; display: flex; min-height: 0; }
    #message-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg { max-width: 65%; }
    .msg .bubble {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid #e5e7eb;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.mine { align-self: flex-end; text-align: right; }
    .msg.mine .bubble { background: #2563eb; color: #fff; border: none; }
    .msg .meta { font-size: 11px; color: #888; margin-bottom: 2px; }
    .msg.editing { max-width: 100%; width: 100%; }

    /* Redacted = deleted by its author; the message row still exists in Chime. */
    .msg .bubble.redacted,
    .msg.mine .bubble.redacted {
      background: #f3f4f6;
      color: #9ca3af;
      border: 1px dashed #d1d5db;
      font-style: italic;
    }

    /* Stand-in for a thread root that is older than the loaded history. */
    .msg.stub .bubble {
      background: #fff;
      border: 1px dashed #d1d5db;
      color: #6b7280;
      font-style: italic;
    }

    /* "3 replies" under a root message: Chime has no threads, so the count is
       derived from the reply pointers in the loaded messages' metadata. */
    .thread-link {
      display: flex;
      gap: 6px;
      align-items: baseline;
      width: fit-content;
      /* Overlaps the bubble's rounded corner so the badge reads as part of the
         message rather than a row of its own. */
      margin: -2px 0 0 12px;
      padding: 2px 8px 2px 10px;
      font-family: inherit;
      font-size: 11px;
      background: #eff6ff;
      border: 1px solid #dbeafe;
      border-top-color: transparent;
      border-radius: 0 0 10px 10px;
      cursor: pointer;
    }
    .thread-link:hover { background: #dbeafe; }
    .thread-link.active { border-color: #2563eb; border-top-color: transparent; }
    .msg.mine .thread-link { margin-left: auto; margin-right: 12px; }
    .thread-count { font-weight: 600; color: #2563eb; }
    .thread-last { color: #6b7280; }

    /* Reply / Edit / Delete, revealed on hover over your own messages. */
    .msg .actions { display: flex; gap: 6px; margin-top: 3px; visibility: hidden; }
    .msg.mine .actions { justify-content: flex-end; }
    .msg:hover .actions { visibility: visible; }
    .msg .actions button {
      font-size: 11px;
      padding: 2px 8px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #fff;
      color: #4b5563;
      cursor: pointer;
    }
    .msg .actions button:hover { background: #f3f4f6; }

    .edit-form { display: flex; gap: 6px; align-items: center; }
    .edit-input {
      flex: 1;
      padding: 8px 12px;
      font-size: 15px;
      border: 1px solid #2563eb;
      border-radius: 12px;
    }
    .edit-form button {
      font-size: 12px;
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    .edit-save { border: none; background: #2563eb; color: #fff; }
    .edit-cancel { border: 1px solid #d1d5db; background: #fff; color: #4b5563; }

    /* ---- Thread panel ---- */
    #thread-panel {
      width: 360px;
      flex: none;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-left: 1px solid #e5e7eb;
    }
    #thread-panel[hidden] { display: none; }
    #thread-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px;
      border-bottom: 1px solid #e5e7eb;
      font-weight: bold;
    }
    #thread-header .thread-title { flex: 1; }
    #thread-channel { display: block; font-size: 11px; font-weight: normal; color: #888; }
    #thread-close {
      flex: none;
      width: 24px;
      height: 24px;
      font-size: 18px;
      line-height: 1;
      border: none;
      border-radius: 50%;
      background: #f3f4f6;
      color: #4b5563;
      cursor: pointer;
    }
    #thread-close:hover { background: #e5e7eb; }
    #thread-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    /* The panel is narrow, so bubbles get more of it than in the timeline. */
    #thread-messages .msg { max-width: 90%; }
    .thread-divider {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #888;
    }
    .thread-divider::after {
      content: "";
      flex: 1;
      border-top: 1px solid #e5e7eb;
    }
    #thread-composer {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid #e5e7eb;
    }
    #thread-input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    #thread-composer button {
      padding: 10px 14px;
      font-size: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }

    #composer {
      display: flex;
      gap: 8px;
      padding: 12px 20px;
      background: #fff;
      border-top: 1px solid #e5e7eb;
    }
    #message-input {
      flex: 1;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    #send-btn {
      padding: 10px 20px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }
    #send-btn:disabled { background: #9ca3af; cursor: default; }
  </style>
</head>
<body>
  <div id="login-screen">
    <h1>Chime Messaging POC</h1>
    <p>Pick a user (open more tabs to chat as other users)</p>
    <div id="user-list"></div>
  </div>

  <div id="chat-screen">
    <div id="sidebar">
      <div class="me">
        <span id="me-name"></span>
        <small>Channels</small>
      </div>
      <div id="channel-list"></div>
    </div>
    <div id="main">
      <div id="channel-header">
        <span id="channel-name"></span>
        <span id="status"></span>
      </div>
      <div id="workspace">
        <div id="message-column">
          <div id="messages"></div>
          <form id="composer">
            <input id="message-input" type="text" placeholder="Type a message..." autocomplete="off" />
            <button id="send-btn" type="submit">Send</button>
          </form>
        </div>
        <aside id="thread-panel" hidden>
          <div id="thread-header">
            <span class="thread-title">
              Thread
              <small id="thread-channel"></small>
            </span>
            <button id="thread-close" type="button" title="Close thread (Esc)">&times;</button>
          </div>
          <div id="thread-messages"></div>
          <form id="thread-composer">
            <input id="thread-input" type="text" placeholder="Reply in thread..." autocomplete="off" />
            <button type="submit">Reply</button>
          </form>
        </aside>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
