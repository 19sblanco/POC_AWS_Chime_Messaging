<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chime Messaging POC</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      height: 100vh;
    }

    /* ---- Login screen ---- */
    #login-screen {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    #login-screen h1 { margin-bottom: 8px; font-size: 22px; }
    #login-screen p { color: #666; margin-bottom: 16px; }
    .user-btn {
      width: 220px;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
    }
    .user-btn:hover { background: #e8f0fe; }

    /* ---- Chat screen ---- */
    #chat-screen { display: none; height: 100%; }
    #chat-screen.active { display: flex; }

    #sidebar {
      width: 220px;
      background: #1f2937;
      color: #fff;
      display: flex;
      flex-direction: column;
    }
    #sidebar .me {
      padding: 16px;
      font-weight: bold;
      border-bottom: 1px solid #374151;
    }
    #sidebar .me small { display: block; font-weight: normal; color: #9ca3af; }
    #channel-list { flex: 1; overflow-y: auto; }
    .channel-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 16px;
      background: none;
      border: none;
      color: #d1d5db;
      font-size: 15px;
      cursor: pointer;
    }
    .channel-btn:hover { background: #374151; }
    .channel-btn.active { background: #2563eb; color: #fff; }

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    #channel-header {
      padding: 14px 20px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      font-weight: bold;
    }
    #status { font-weight: normal; font-size: 12px; color: #888; margin-left: 8px; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg { max-width: 65%; }
    .msg .bubble {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid #e5e7eb;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.mine { align-self: flex-end; text-align: right; }
    .msg.mine .bubble { background: #2563eb; color: #fff; border: none; }
    .msg .meta { font-size: 11px; color: #888; margin-bottom: 2px; }
    .msg.editing { max-width: 100%; width: 100%; }

    /* Redacted = deleted by its author; the message row still exists in Chime. */
    .msg .bubble.redacted,
    .msg.mine .bubble.redacted {
      background: #f3f4f6;
      color: #9ca3af;
      border: 1px dashed #d1d5db;
      font-style: italic;
    }

    /* Quoted parent of a reply. Chime has no threads: the quote is rebuilt from
       the pointer this client stored in the message's metadata. */
    .msg .quote {
      display: flex;
      gap: 6px;
      align-items: baseline;
      width: fit-content;
      max-width: 100%;
      margin-bottom: 3px;
      padding: 4px 10px;
      font-family: inherit;
      font-size: 12px;
      text-align: left;
      background: #f3f4f6;
      border: none;
      border-left: 3px solid #93c5fd;
      border-radius: 4px;
      color: #4b5563;
      cursor: pointer;
    }
    .msg .quote:hover { background: #e5e7eb; }
    .msg.mine .quote { margin-left: auto; }
    .msg .quote-sender { flex: none; font-weight: 600; color: #2563eb; }
    .msg .quote-preview { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Pulse when a quote jumps to its parent. */
    @keyframes flash-highlight {
      0%, 100% { box-shadow: none; }
      20%, 60% { box-shadow: 0 0 0 3px #fbbf24; }
    }
    .msg.flash .bubble { animation: flash-highlight 1.4s ease-out; }

    /* Reply / Edit / Delete, revealed on hover over your own messages. */
    .msg .actions { display: flex; gap: 6px; margin-top: 3px; visibility: hidden; }
    .msg.mine .actions { justify-content: flex-end; }
    .msg:hover .actions { visibility: visible; }
    .msg .actions button {
      font-size: 11px;
      padding: 2px 8px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #fff;
      color: #4b5563;
      cursor: pointer;
    }
    .msg .actions button:hover { background: #f3f4f6; }

    .edit-form { display: flex; gap: 6px; align-items: center; }
    .edit-input {
      flex: 1;
      padding: 8px 12px;
      font-size: 15px;
      border: 1px solid #2563eb;
      border-radius: 12px;
    }
    .edit-form button {
      font-size: 12px;
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    .edit-save { border: none; background: #2563eb; color: #fff; }
    .edit-cancel { border: 1px solid #d1d5db; background: #fff; color: #4b5563; }

    #reply-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      background: #eff6ff;
      border-top: 1px solid #e5e7eb;
      font-size: 13px;
      color: #4b5563;
    }
    #reply-banner[hidden] { display: none; }
    .reply-banner-text {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #reply-banner-preview { color: #6b7280; }
    #reply-cancel {
      flex: none;
      width: 22px;
      height: 22px;
      font-size: 16px;
      line-height: 1;
      border: none;
      border-radius: 50%;
      background: #dbeafe;
      color: #1e40af;
      cursor: pointer;
    }
    #reply-cancel:hover { background: #bfdbfe; }

    #composer {
      display: flex;
      gap: 8px;
      padding: 12px 20px;
      background: #fff;
      border-top: 1px solid #e5e7eb;
    }
    #message-input {
      flex: 1;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    #send-btn {
      padding: 10px 20px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }
    #send-btn:disabled { background: #9ca3af; cursor: default; }
  </style>
</head>
<body>
  <div id="login-screen">
    <h1>Chime Messaging POC</h1>
    <p>Pick a user (open more tabs to chat as other users)</p>
    <div id="user-list"></div>
  </div>

  <div id="chat-screen">
    <div id="sidebar">
      <div class="me">
        <span id="me-name"></span>
        <small>Channels</small>
      </div>
      <div id="channel-list"></div>
    </div>
    <div id="main">
      <div id="channel-header">
        <span id="channel-name"></span>
        <span id="status"></span>
      </div>
      <div id="messages"></div>
      <div id="reply-banner" hidden>
        <div class="reply-banner-text">
          Replying to <strong id="reply-banner-sender"></strong>
          <span id="reply-banner-preview"></span>
        </div>
        <button id="reply-cancel" type="button" title="Cancel reply (Esc)">&times;</button>
      </div>
      <form id="composer">
        <input id="message-input" type="text" placeholder="Type a message..." autocomplete="off" />
        <button id="send-btn" type="submit">Send</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
